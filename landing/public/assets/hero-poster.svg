<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a16"/>
      <stop offset="0.55" stop-color="#0a1226"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="28%" r="55%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- suggestion of a road receding to a vanishing point -->
  <g stroke="#38bdf8" stroke-opacity="0.10" stroke-width="2">
    <line x1="800" y1="500" x2="120" y2="900"/>
    <line x1="800" y1="500" x2="1480" y2="900"/>
    <line x1="800" y1="500" x2="560" y2="900"/>
    <line x1="800" y1="500" x2="1040" y2="900"/>
  </g>
  <g fill="#22d3ee" fill-opacity="0.22">
    <rect x="792" y="560" width="16" height="30" rx="3"/>
    <rect x="788" y="620" width="24" height="34" rx="4"/>
    <rect x="782" y="700" width="36" height="42" rx="5"/>
  </g>
</svg>
